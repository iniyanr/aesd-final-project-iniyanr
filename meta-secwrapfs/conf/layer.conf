# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-secwrapfs"
BBFILE_PATTERN_meta-secwrapfs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-secwrapfs = "6"

LAYERDEPENDS_meta-secwrapfs = "core"
LAYERSERIES_COMPAT_meta-secwrapfs = "scarthgap"
